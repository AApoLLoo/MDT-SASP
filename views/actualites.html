{{> header}}
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <h1>Actualités</h1>
        <p class="muted">Tous les communiqués, bilans d'opérations et annonces de la SASP.</p>
      </div>
    </header>
    <section class="section section--tight">
      <div class="wrap">
        <div class="section__head">
          <div class="filters" role="group" aria-label="Filtrer par catégorie">{{{filters}}}</div>
        </div>
        <div class="news" data-news>{{{news}}}</div>
      </div>
    </section>
  </main>
{{> footer}}
