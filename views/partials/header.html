<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:site_name" content="San Andreas State Police">
  <meta name="theme-color" content="#071226">
  <link rel="icon" href="/img/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" href="/mdt/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/mdt/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/theme.js?v={{v}}"></script>
  <link rel="stylesheet" href="/styles.css?v={{v}}">
  <script src="/main.js?v={{v}}" defer></script>
  {{{headExtra}}}
</head>
<body class="{{bodyClass}}">
  <a class="skip" href="#main">Aller au contenu</a>

  <div class="govbar" role="region" aria-label="Urgences et liens utiles">
    <div class="wrap govbar__inner">
      <p class="govbar__emergency"><strong>911</strong> Urgence ou danger immédiat</p>
      <nav class="govbar__links" aria-label="Liens utiles">
        <a href="/agent">Espace agent</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span class="theme-toggle__label">Mode sombre</span>
        </button>
      </nav>
    </div>
  </div>

  <header class="topbar" id="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="/" aria-label="San Andreas State Police, accueil">
        <img class="brand__badge" src="/img/logo-128.webp" alt="" decoding="async">
        <span class="brand__text">
          <strong>San Andreas State Police</strong>
          <small>Département de la Sécurité publique</small>
        </span>
      </a>
      <nav id="nav" class="nav" aria-label="Navigation principale">
        <div class="nav__inner">
          <a href="/">Accueil</a>
          <a href="/contact">Déposer une demande</a>
          <a href="/suivi">Suivre ma demande</a>
          <a href="/actualites">Actualités</a>
          <a href="/service">Le service</a>
          <a href="/#recrutement">Recrutement</a>
        </div>
      </nav>
      <a class="btn btn--gold topbar__cta" href="/contact" data-magnetic>Contacter la SASP</a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="nav">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        Menu
      </button>
    </div>
  </header>
